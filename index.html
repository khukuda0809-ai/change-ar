<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>CHANGE</title>
  <style>html,body{margin:0;height:100%;background:#0b0714}</style>
  <script>
    // QRの入口。毎回、最新の AR ページ（ar.html）へ移動する。
    // このファイルは今後変更しないので、スマホに残っていても問題ない。
    function go() {
      var q = location.search ? location.search + '&' : '?';
      location.replace('./ar.html' + q + 't=' + Date.now());
    }
    go();
    window.addEventListener('pageshow', function (e) { if (e.persisted) go(); });
  </script>
</head>
<body></body>
</html>
