<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>change AR</title>
  <script>
    // ===== ここだけ書き換えればOK =====
    const CONFIG = {
      eventDate: "2027-02-25",        // アワード本番日（年-月-日）
      infoImage: "./info.png",        // 変化後に表示するお知らせ画像（差し替え用）
      linkUrl: "https://lin.ee/n4lQLWP",                  // ボタンのリンク先（空なら非表示）
      linkLabel: "LINE公式アカウント",      // ボタンの文字
      autoJumpSec: 3                  // お知らせ表示から何秒後にリンク先へ自動で飛ぶか（0なら飛ばない）
    };
    // ==================================
  </script>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; }
    #start { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #0b0714; color: #ffffff; text-align: center; padding: 24px; }
    #start h1 { margin: 0; font-size: 56px; font-weight: 900; color: #ff3cc8; text-shadow: 0 0 18px #ff3cc8; letter-spacing: -0.02em; font-family: "Helvetica Neue", Arial, sans-serif; }
    #start p { margin: 0; font-size: 15px; line-height: 1.8; color: #ddd; }
    #start button { margin-top: 8px; padding: 16px 44px; font-size: 17px; font-weight: 700; border: 0; border-radius: 999px; background: #ff3cc8; color: #fff; }
    #scanning { position: fixed; left: 0; right: 0; bottom: 100px; z-index: 10; display: flex; justify-content: center; pointer-events: none; }
    #scanning div { background: rgba(0,0,0,0.6); color: #fff; padding: 12px 20px; border-radius: 999px; font-size: 14px; }
    #bar { position: fixed; left: 0; right: 0; bottom: 32px; z-index: 10; display: none; justify-content: center; gap: 10px; padding: 0 16px; }
    #bar button, #bar a { padding: 12px 20px; border: 0; border-radius: 999px; font-size: 14px; font-weight: 700; text-decoration: none; }
    #replay { background: rgba(255,255,255,0.92); color: #0e0e0e; }
    #link { background: #06C755; color: #fff; display: none; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="start">
    <h1>CHANGE</h1>
    <p>ボタンを押したあと、<br>カメラをポスター全体に向けてください。</p>
    <button id="startBtn">はじめる</button>
  </div>
  <div id="scanning" class="hidden"><div>ポスター全体をカメラに映してください</div></div>
  <div id="bar">
    <button id="replay">もう一度見る</button>
    <a id="link" target="_blank" rel="noopener"></a>
  </div>

  <!-- ファイルを差し替えたら、下と mindar-image の「?v=」の文字を変える -->
  <video id="changeVideo" src="./change.mp4?v=20261121d" preload="auto" muted playsinline webkit-playsinline crossorigin="anonymous" style="display:none"></video>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind?v=20261121d; autoStart: false; uiScanning: #scanning; uiLoading: no; filterMinCF: 0.0001; filterBeta: 0.001"
    color-space="sRGB" renderer="colorManagement: true"
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-video id="videoPlane" src="#changeVideo" width="1" height="1.3333" position="0 0 0"></a-video>
      <a-plane id="infoPlane" width="1" height="1.3333" position="0 0 0.01" visible="false"
               material="shader: flat; transparent: true; opacity: 0"></a-plane>
    </a-entity>
  </a-scene>

  <script>
    const video = document.getElementById('changeVideo');
    const target = document.getElementById('target');
    const infoPlane = document.getElementById('infoPlane');
    const bar = document.getElementById('bar');
    const link = document.getElementById('link');
    const scene = document.querySelector('a-scene');

    // 前に開いたタブに戻ったときは読み込み直す
    window.addEventListener('pageshow', (e) => { if (e.persisted) location.reload(); });
    let infoShown = false;

    // カウントダウンの計算（日本時間）
    function daysLeft() {
      const [y, m, d] = CONFIG.eventDate.split('-').map(Number);
      const event = Date.UTC(y, m - 1, d);
      const jst = new Date(Date.now() + 9 * 3600 * 1000);
      const today = Date.UTC(jst.getUTCFullYear(), jst.getUTCMonth(), jst.getUTCDate());
      return Math.round((event - today) / 86400000);
    }

    // お知らせ画像＋カウントダウンを1枚の絵にする
    function buildInfoTexture() {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          const W = 1024, H = Math.round(1024 * 4 / 3);
          const c = document.createElement('canvas');
          c.width = W; c.height = H;
          const g = c.getContext('2d');
          g.drawImage(img, 0, 0, W, H);
          const s = W / 1792;
          const box = { x: 70 * s, y: 300 * s, w: 1652 * s, h: 760 * s };
          const n = daysLeft();
          const num = '"Helvetica Neue", "Arial Black", Arial, sans-serif';
          const jp = '"Hiragino Sans", "Noto Sans JP", sans-serif';
          g.fillStyle = '#ffffff';
          g.textBaseline = 'alphabetic';
          if (n > 0) {
            g.font = `900 ${Math.round(70 * s)}px ${jp}`;
            g.textAlign = 'left';
            g.fillText('当日まで あと', box.x + 50 * s, box.y + 230 * s);
            g.font = `900 ${Math.round(420 * s)}px ${num}`;
            g.textAlign = 'right';
            g.fillStyle = '#ff3cc8';
            g.fillText(String(n), box.x + box.w - 260 * s, box.y + 640 * s);
            g.fillStyle = '#ffffff';
            g.font = `900 ${Math.round(160 * s)}px ${jp}`;
            g.textAlign = 'left';
            g.fillText('日', box.x + box.w - 230 * s, box.y + 640 * s);
          } else {
            g.font = `900 ${Math.round(150 * s)}px ${jp}`;
            g.textAlign = 'center';
            g.fillStyle = '#ff3cc8';
            g.fillText(n === 0 ? '本日開催！' : '開催しました', box.x + box.w / 2, box.y + 470 * s);
          }
          const [y, m, d] = CONFIG.eventDate.split('-').map(Number);
          const wd = ['SUN','MON','TUE','WED','THU','FRI','SAT'][new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
          g.fillStyle = '#ffffff';
          g.font = `700 ${Math.round(44 * s)}px ${num}`;
          g.textAlign = 'left';
          g.fillText(`${y}.${String(m).padStart(2,'0')}.${String(d).padStart(2,'0')} ${wd}`, box.x + 110 * s, box.y + box.h - 60 * s);
          resolve(c);
        };
        img.src = CONFIG.infoImage + '?t=' + Date.now();
      });
    }

    let texReady = buildInfoTexture().then((canvas) => {
      const url = canvas.toDataURL('image/jpeg', 0.92);
      const apply = () => infoPlane.setAttribute('material', { shader: 'flat', src: url, transparent: true, opacity: 0 });
      if (infoPlane.hasLoaded) apply(); else infoPlane.addEventListener('loaded', apply);
    });

    if (CONFIG.linkUrl) {
      link.href = CONFIG.linkUrl;
      link.textContent = CONFIG.linkLabel;
      link.style.display = 'inline-block';
    }

    function showInfo() {
      infoShown = true;
      texReady.then(() => {
        infoPlane.setAttribute('visible', true);
        infoPlane.setAttribute('animation', 'property: material.opacity; from: 0; to: 1; dur: 700; easing: easeOutQuad');
        bar.style.display = 'flex';
        startAutoJump();
      });
    }

    let jumpTimer = null;
    function startAutoJump() {
      if (!CONFIG.linkUrl || !CONFIG.autoJumpSec) return;
      let left = CONFIG.autoJumpSec;
      link.textContent = CONFIG.linkLabel + '（' + left + '）';
      jumpTimer = setInterval(() => {
        left--;
        if (left > 0) { link.textContent = CONFIG.linkLabel + '（' + left + '）'; return; }
        clearInterval(jumpTimer); jumpTimer = null;
        link.textContent = CONFIG.linkLabel;
        location.href = CONFIG.linkUrl;
      }, 1000);
    }
    function stopAutoJump() {
      if (jumpTimer) { clearInterval(jumpTimer); jumpTimer = null; }
      link.textContent = CONFIG.linkLabel;
    }

    function playFromStart() {
      stopAutoJump();
      infoShown = false;
      infoPlane.removeAttribute('animation');
      infoPlane.setAttribute('material', 'opacity', 0);
      infoPlane.setAttribute('visible', false);
      bar.style.display = 'none';
      video.currentTime = 0;
      video.play();
    }

    // カメラ映像が止まっていないか見張る（iPhone の初回カメラ許可で真っ黒になる対策）
    function camVideo() { const sys = scene.systems['mindar-image-system']; return sys && sys.video; }
    function camAlive() { const v = camVideo(); return v && v.videoWidth > 0 && !v.paused && v.readyState >= 2; }
    function kickCam() { const v = camVideo(); if (v && v.paused) { v.muted = true; v.setAttribute('playsinline', ''); v.play().catch(() => {}); } }
    function watchCam() {
      let tries = 0;
      const timer = setInterval(() => {
        if (camAlive() || ++tries > 40) { clearInterval(timer); return; }
        kickCam();
      }, 500);
    }
    // 画面をタップしたときもカメラを再開させる
    document.addEventListener('touchend', kickCam);
    document.addEventListener('click', kickCam);

    function startAR() {
      try { const p = video.play(); if (p) p.then(() => { video.pause(); video.currentTime = 0; }).catch(() => {}); } catch (e) {}
      document.getElementById('start').style.display = 'none';
      const ar = scene.systems['mindar-image-system'];
      let started = false;
      const go = () => {
        if (started) return; started = true;
        ar.start();
        // カメラ映像を「ミュートの動画」としてその場で再生させる（iPhone で真っ黒になる対策）
        const v = camVideo();
        if (v) {
          v.muted = true; v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
          v.addEventListener('loadedmetadata', () => v.play().catch(() => {}));
          v.addEventListener('pause', () => setTimeout(kickCam, 100));
          v.play().catch(() => {});
        }
        watchCam();
      };
      if (scene.hasLoaded) go(); else { scene.addEventListener('loaded', go); setTimeout(() => { if (scene.hasLoaded) go(); }, 1500); }
    }
    document.getElementById('startBtn').addEventListener('click', startAR);

    target.addEventListener('targetFound', () => {
      if (infoShown) { bar.style.display = 'flex'; return; }
      video.play();
    });
    target.addEventListener('targetLost', () => { if (!infoShown) video.pause(); });
    video.addEventListener('ended', showInfo);
    document.getElementById('replay').addEventListener('click', playFromStart);
  </script>
  <script>
    // ?debug=1 を付けて開くと、画面の上に動作状況を表示する（原因調査用）
    if (/[?&]debug=1/.test(location.search)) {
      CONFIG.autoJumpSec = 0;
      const box = document.createElement('pre');
      box.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99;margin:0;padding:6px 8px;font:11px/1.35 monospace;color:#0f0;background:rgba(0,0,0,.75);white-space:pre-wrap;pointer-events:none';
      document.body.appendChild(box);
      const ev = [];
      const t0 = Date.now();
      const log = (m) => { ev.push(((Date.now() - t0) / 1000).toFixed(1) + 's ' + m); if (ev.length > 14) ev.shift(); };
      window.addEventListener('error', (e) => log('ERR ' + e.message));
      window.addEventListener('unhandledrejection', (e) => log('REJ ' + (e.reason && e.reason.message || e.reason)));
      ['loaded', 'renderstart', 'arReady', 'arError'].forEach((n) => scene.addEventListener(n, () => log(n)));
      ['targetFound', 'targetLost'].forEach((n) => target.addEventListener(n, () => log(n)));
      ['play', 'pause', 'ended', 'loadeddata', 'error'].forEach((n) => video.addEventListener(n, () => log('mov:' + n)));
      document.getElementById('startBtn').addEventListener('click', () => log('START tap'));
      setInterval(() => {
        const v = camVideo();
        const cv = scene.canvas;
        const cs = v ? getComputedStyle(v) : null;
        box.textContent =
          'UA ' + navigator.userAgent.replace(/.*(iPhone OS [\d_]+|Android [\d.]+).*/, '$1') + '\n' +
          'scene loaded=' + scene.hasLoaded + ' body=' + document.body.clientWidth + 'x' + document.body.clientHeight + ' win=' + innerWidth + 'x' + innerHeight + '\n' +
          'cam: ' + (v ? ('w=' + v.videoWidth + ' h=' + v.videoHeight + ' paused=' + v.paused + ' rs=' + v.readyState + ' t=' + v.currentTime.toFixed(1) + ' muted=' + v.muted + ' css=' + cs.width + 'x' + cs.height + ' z=' + cs.zIndex) : 'none') + '\n' +
          'canvas: ' + (cv ? (cv.clientWidth + 'x' + cv.clientHeight + ' vis=' + getComputedStyle(cv).visibility) : 'none') + '\n' +
          'movie: rs=' + video.readyState + ' t=' + video.currentTime.toFixed(1) + ' paused=' + video.paused + ' w=' + video.videoWidth + '\n' +
          'target visible=' + target.object3D.visible + ' info=' + infoShown + '\n' + ev.join('\n');
      }, 500);
    }
  </script>
</body>
</html>
